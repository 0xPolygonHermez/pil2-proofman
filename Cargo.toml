[workspace.package]
version = "1.0.0-beta"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["pil2-proofman", "prover", "zero-knowledge"]
repository = "https://github.com/0xPolygonHermez/pil2-proofman"
categories = ["cryptography"]

[workspace]
members = [
    # Core crates
    "cli",
    "curves",
    "common",
    "fields",
    "hints",
    "pilout",
    "proofman",
    "macros",
    "provers/starks-lib-c",
    "pil2-stark",
    "witness",
    "util",
    "verifier",
    "soundness",
    "setup/stark-recurser",
    "setup/pil2-stark",

    # PIL2 components library
    "pil2-components/lib/std/rs",

    # PIL2 component tests
    "pil2-components/test/connection/rs",
    "pil2-components/test/diff_buses/rs",
    "pil2-components/test/direct_update/rs",
    "pil2-components/test/lookup/rs",
    "pil2-components/test/one_instance/rs",
    "pil2-components/test/permutation/rs",
    "pil2-components/test/range_check/rs",
    "pil2-components/test/simple/rs",
    "pil2-components/test/special/rs",
    "pil2-components/test/virtual_tables/rs",
    "pil2-components/test/common/rs",

    # Examples
    "examples/fibonacci-square",
    "examples/test-recursive",
    "macros-test",
]

default-members = [
    "cli",
    "curves",
    "common",
    "fields",
    "hints",
    "pilout",
    "proofman",
    "macros",
    "provers/starks-lib-c",
    "pil2-stark",
    "witness",
    "util",
    "verifier",
    "soundness",
    "setup/stark-recurser",
    "setup/pil2-stark",
]

resolver = "2"

[workspace.dependencies]
proofman-macros = { path = "macros", version = "1.0.0-beta" }
proofman = { path = "proofman", version = "1.0.0-beta" }
proofman-common = { path = "common", version = "1.0.0-beta" }
proofman-starks-lib-c = { path = "provers/starks-lib-c", version = "1.0.0-beta" }
proofman-starks-src = { path = "pil2-stark", version = "1.0.0-beta" }
proofman-hints = { path = "hints", version = "1.0.0-beta" }
proofman-soundness = { path = "soundness", version = "1.0.0-beta" }
proofman-verifier = { path = "verifier", version = "1.0.0-beta" }
proofman-util = { path = "util", version = "1.0.0-beta" }
proofman-cli = { path = "cli", version = "1.0.0-beta" }
pil-std-lib = { path = "pil2-components/lib/std/rs", version = "1.0.0-beta" }
proofman-witness = { path = "witness", version = "1.0.0-beta" }
proofman-curves = { path = "curves", version = "1.0.0-beta" }
pilout = { path = "pilout", version = "1.0.0-beta" }
proofman-fields = { path = "fields", version = "1.0.0-beta" }
log = { version = "0.4", default-features = false }
env_logger = "0.11"
bytes = "1.11.1"
prost = "0.13"
num-bigint = "0.4"
prost-build = "0.13"
num-traits = "0.2"
crossbeam-channel = "0.5.15"
rayon = "1"
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0.68"
serde_arrays = "0.2"
colored = "3"
tracing = "0.1"
libloading = "0.8.7"
sysinfo = "0.35.1"
blake3 = "1.3.1"
csv = "1.3.1"
bincode = { version = "2.0", default-features = false, features = ["serde", "std"] }
borsh = { version = "1.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7.16"
tracing-subscriber = "0.3.19"
rustc-hash = "2.1.1"
itoa = "1.0.17"
thiserror = { version = "2" }
rand = "0.10"
anyhow = "1"
