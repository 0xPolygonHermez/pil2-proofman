name: CI Checks
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  cargo-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Rust Toolchain
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sudo apt install -y build-essential libbenchmark-dev libomp-dev libgmp-dev nlohmann-json3-dev nasm libsodium-dev cmake
          sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"
      - name: Install Node dependencies (pil2-compiler)
        run: npm install
        working-directory: setup/pil2-stark
      - name: cargo test
        run: cargo test --workspace
  cargo-check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Set up Rust Toolchain
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y
  cargo-fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust Toolchain
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y
      - name: cargo fmt
        run: cargo fmt -- --check
  markdown-book:
    name: markdown book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust Toolchain
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y
      - name: install mdbook
        run: cargo install mdbook
      - name: mdbook build
        run: mdbook build
  cargo-fix:
    name: cargo fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sudo apt install -y build-essential libbenchmark-dev libomp-dev libgmp-dev nlohmann-json3-dev nasm libsodium-dev cmake
          sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev
      - name: Set up Rust Toolchain
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"
      - name: Install Node dependencies (pil2-compiler)
        run: npm install
        working-directory: setup/pil2-stark
      - name: cargo fix --workspace
        run: |
          # Run cargo fix on the project
          cargo fix --workspace --allow-dirty --allow-staged

          # Check for local git changes
          if ! git diff --exit-code; then
              echo "There are local changes after running 'cargo fix --workspace' ❌"
              exit 1
          else
              echo "No changes detected after running 'cargo fix --workspace' ✅"
          fi
  cargo-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sudo apt install -y build-essential libbenchmark-dev libomp-dev libgmp-dev nlohmann-json3-dev nasm libsodium-dev cmake
          sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev
      - name: Set up Rust Toolchain
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"
      - name: Install Node dependencies (pil2-compiler)
        run: npm install
        working-directory: setup/pil2-stark
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Set up Rust Toolchain
        run: curl https://sh.rustup.rs -sSf | sh -s -- -y
      - name: install cargo-audit
        run: cargo install cargo-audit
      - name: cargo audit
        run: cargo audit
  golden-setup:
    # The non-recursive STARK setup of the programs in test-fibo and test-std must
    # stay byte-identical to setup/golden/manifest.sha256 (see setup/golden/README.md),
    # and plonk2pil's outputs for the test-recursive circuits to
    # setup/golden/plonk2pil/manifest.sha256 (see setup/golden/plonk2pil/README.md).
    name: Golden setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - name: Install Node dependencies (pil2-compiler)
        run: npm install
        working-directory: setup/pil2-stark

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sudo apt install -y build-essential libbenchmark-dev libomp-dev libgmp-dev nlohmann-json3-dev nasm libsodium-dev cmake
          sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev

      - name: Check setup outputs against the golden manifest
        run: ./setup/golden/check.sh

      - name: Upload setup outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-setup
          path: target/golden-setup
          retention-days: 7

      # Independent of the check above, so it runs whether that one passed or not.
      # circom is the committed setup/circom/circom; Node.js is not needed.
      - name: Check plonk2pil outputs against the golden manifest
        if: ${{ !cancelled() }}
        run: ./setup/golden/plonk2pil/check.sh

      # The text outputs only: the execs and fixed columns run to hundreds of MB.
      - name: Upload plonk2pil outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-plonk2pil
          path: |
            target/golden-plonk2pil/manifest.sha256
            target/golden-plonk2pil/logs
            target/golden-plonk2pil/golden/*/air.pil
            target/golden-plonk2pil/golden/*/result.json
          retention-days: 7
  test-fibo:
    name: Test Fibonacci Square (with aggregation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"
      - name: Install npm
        run: npm install -g npm
      - name: Check npm version
        run: npm --version

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install z3-solver
        run: |
          python -m pip install z3-solver

      - name: Check out circom
        uses: actions/checkout@v4
        with:
          repository: iden3/circom
          path: circom-repo


      - name: Build and install Circom
        working-directory: circom-repo
        run: |
          cargo build --release --workspace
          cargo install --path circom

      - name: Install Node dependencies (pil2-compiler, snarkjs)
        run: npm install
        working-directory: setup/pil2-stark

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sudo apt install -y build-essential libbenchmark-dev libomp-dev libgmp-dev nlohmann-json3-dev nasm libsodium-dev cmake
          sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev

      - name: Compile PIL Fibonacci Square
        run: |
          cargo run --bin proofman-setup -- compile-pil --pil ./examples/fibonacci-square/pil/build.pil -I ./pil2-components/lib/std/pil -o ./examples/fibonacci-square/pil/build.pilout -u ./examples/fibonacci-square/build/fixed --fixed-to-file

      - name: Generate setup Fibonacci Square
        run: |
          cargo run --bin proofman-setup -- setup -a ./examples/fibonacci-square/pil/build.pilout -b ./examples/fibonacci-square/build -r -u ./examples/fibonacci-square/build/fixed --hash Poseidon1

      - name: Generate PIL Helpers Fibonacci Square
        run: |
          cargo run --bin proofman-cli pil-helpers --pilout ./examples/fibonacci-square/pil/build.pilout --path ./examples/fibonacci-square/src -o

      - name: Cargo build
        run: RUST_BACKTRACE=1 cargo build -v --workspace

      - name: Generate Custom Commits Fixed Fibonacci Square
        run: |
          cargo run --bin proofman-cli gen-custom-commits-fixed --witness-lib ./target/debug/libfibonacci_square.so --proving-key examples/fibonacci-square/build/provingKey/ --custom-commits rom=buffer.bin
      
      - name: Verify constraints Fibonacci Square
        run: |
          cargo run --bin proofman-cli verify-constraints --witness-lib ./target/debug/libfibonacci_square.so --proving-key examples/fibonacci-square/build/provingKey/ --public-inputs examples/fibonacci-square/src/inputs.json --custom-commits rom=buffer.bin

      - name: Generate proof Fibonacci Square
        run: |
          cargo run --bin proofman-cli prove --witness-lib ./target/debug/libfibonacci_square.so --proving-key examples/fibonacci-square/build/provingKey/ --public-inputs examples/fibonacci-square/src/inputs.json --output-dir examples/fibonacci-square/build/proofs --custom-commits rom=buffer.bin -a

      - name: Verify vadcop final proof Fibonacci Square
        run: |
          cargo run --bin proofman-cli verify-stark --proof ./examples/fibonacci-square/build/proofs/vadcop_final_proof.bin --verkey ./examples/fibonacci-square/build/provingKey/build/vadcop_final/vadcop_final.verkey.bin
      
      - name: Clean proof dir
        run: |
          rm -rf examples/fibonacci-square/build/proofs
        
      # - name: Cargo build distributed
      #   run: RUST_BACKTRACE=1 cargo build --features distributed -v

      # - name: Generate proof Fibonacci Square distributed
      #   run: | 
      #     mpirun --bind-to none -np 3 -x OMP_NUM_THREADS=80 target/debug/proofman-cli  prove --witness-lib ./target/debug/libfibonacci_square.so --public-inputs examples/fibonacci-square/src/inputs.json --proving-key examples/fibonacci-square/build/provingKey/ --output-dir examples/fibonacci-square/build/proofs -a

  test-pilfflonk:
    # pilfflonk's tests that need neither the BN128 compiler nor a GPU (pilfflonk/docs/README.md#tests):
    # the C++ tests against the CPU library (pil2-stark/test/pilfflonk), which also guard the
    # rapidsnark Polynomial methods FFLONK shares, and the JS verifier's (pilfflonk/js).
    name: Test pilfflonk (C++ and JS verifier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y build-essential libbenchmark-dev libomp-dev libgmp-dev nlohmann-json3-dev nasm libsodium-dev cmake
          sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - name: C++ tests (CPU)
        run: make -C pil2-stark -j"$(nproc)" pilfflonk_test

      - name: JS verifier tests
        working-directory: pilfflonk/js
        run: |
          npm install
          npm test

  test-pilfflonk-bn128:
    # pilfflonk's tests that compile PIL over BN128, #[ignore]d without PIL2C_EXEC
    # (pilfflonk/docs/README.md#tests): the std over BN128 and the oracle, the setup (the bytecode and
    # the Solidity verifier on Foundry), the fixtures' witness libraries, the wrap's witness, pil-info
    # over BN128, plonk2pil's BN128 family and the wrap's gates, and the CLI's `pilfflonk check`,
    # `verify` and `prove`, with Foundry's end to end and the differential fuzzer
    # (pilfflonk/docs/verifier.md#tests). The compiler is the wrap job's;
    # Foundry and solc are the pinned ones (pilfflonk/docs/verifier.md#tools), solc checked against
    # the sha256 of soliditylang.org's list.
    #
    # Skipped: the two tests that the CLI refuses a STARK witness library, which fail while every
    # library that links proofman exports pilfflonk_init_library (M54), and the wrap-witness test of a
    # real final circuit, which needs one (PILFFLONK_WRAP_FINAL, PILFFLONK_WRAP_ZKIN). The suites run
    # with two test threads (pilfflonk/docs/README.md#tests, Threads).
    name: Test pilfflonk (BN128)
    runs-on: ubuntu-latest
    env:
      PIL2_COMPILER_COMMIT: f4fbf33a9d8aae1381b9e57056b09c293522df2c
      CARGO_FEATURES: proofman-starks-lib-c/cpu-only
      FOUNDRY_VERSION: v1.8.3
      SOLC_URL: https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.37+commit.f401782d
      SOLC_SHA256: 5de843c2c93563cc66425c99a4fb13fdbf32b4c4ae07469480faaf126e14404a
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out pil2-compiler (BN128)
        uses: actions/checkout@v4
        with:
          repository: 0xPolygonHermez/pil2-compiler
          ref: ${{ env.PIL2_COMPILER_COMMIT }}
          path: pil2-compiler-bn128

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - name: Install Node dependencies (pil2-compiler, snarkjs)
        run: npm install
        working-directory: setup/pil2-stark

      - name: Install Node dependencies (pil2-compiler BN128)
        run: npm ci
        working-directory: pil2-compiler-bn128

      - name: Install Node dependencies (pilfflonk JS verifier)
        run: npm install
        working-directory: pilfflonk/js

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sudo apt install -y build-essential libbenchmark-dev libomp-dev libgmp-dev nlohmann-json3-dev nasm libsodium-dev cmake
          sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install solc
        run: |
          curl -sSfL "$SOLC_URL" -o "$RUNNER_TEMP/solc"
          echo "$SOLC_SHA256  $RUNNER_TEMP/solc" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/solc"

      - name: Set up circom, the BN128 compiler, Foundry and solc
        run: |
          echo "$GITHUB_WORKSPACE/setup/circom" >> "$GITHUB_PATH"
          echo "PIL2C_EXEC=$GITHUB_WORKSPACE/pil2-compiler-bn128/src/pil.js" >> "$GITHUB_ENV"
          echo "PILFFLONK_FORGE=$(command -v forge)" >> "$GITHUB_ENV"
          echo "PILFFLONK_SOLC=$RUNNER_TEMP/solc" >> "$GITHUB_ENV"

      - name: The std over BN128, the oracle and setup-pilfflonk from setup-snark's crate
        run: |
          cargo test --release --features "$CARGO_FEATURES" -p proofman-pilfflonk --test std_bn128 --test fibonacci \
            -p pil2-stark-setup --test setup_pilfflonk -- --ignored --test-threads 2

      - name: setup-pilfflonk (with the Solidity verifier on Foundry)
        run: cargo test --release --features "$CARGO_FEATURES" -p pilfflonk-setup -- --ignored --test-threads 2

      - name: The fixtures' witness libraries and the wrap's witness
        run: |
          cargo test --release --features "$CARGO_FEATURES" -p pilfflonk-fibonacci -p pilfflonk-connection -p pilfflonk-all \
            -p proofman-starks-lib-c -p pilfflonk-wrap-witness -- --ignored --test-threads 2 \
            --skip the_witness_of_a_final_circuit_checks

      - name: pil-info over BN128
        run: cargo test --release -p pil-info --test bn128 -- --ignored --test-threads 2

      # Not #[ignore]d: without node, setup/pil2-stark's snarkjs or PIL2C_EXEC they say why and pass,
      # as the workspace's cargo test has them; here they have all three.
      - name: plonk2pil's BN128 family and the wrap's gates
        run: |
          cargo test --release --features "$CARGO_FEATURES" -p pil2-stark-recurser -p proofman-starks-lib-c \
            --test plonk2pil_bn128 --test poseidon_bn128_wrap --test range_check_bn128 -- --test-threads 2

      - name: pilfflonk check and verify
        run: |
          cargo test --release --features "$CARGO_FEATURES" -p proofman-cli --test pilfflonk_check --test pilfflonk_verify \
            -- --ignored --test-threads 2 --skip the_cli_refuses_what_is_not_a_pilfflonk_witness_library

      - name: pilfflonk prove (with Foundry's end to end and the differential fuzzer)
        run: |
          cargo test --release --features "$CARGO_FEATURES" -p proofman-cli --test pilfflonk_prove \
            -- --ignored --test-threads 2 --skip the_prover_refuses_what_is_not_a_pilfflonk_witness_library

  test-pilfflonk-wrap:
    # The final SNARK wrap with pilfflonk, end to end on fibonacci-square: a vadcop_final proof,
    # setup-snark --final-snark pilfflonk, and cli/tests/snark_pilfflonk.rs, whose tests run
    # prove-snark and verify-snark on that key and proof, and on the Fibonacci fixture, and check
    # that verify-snark refuses a changed evaluation, a changed public and another key's vkey.
    #
    # The wrap's AIR is compiled over BN128, which needs a pil2com that has `--field`
    # (pilfflonk/docs/README.md#compile-pil): commit PIL2_COMPILER_COMMIT of pil2-compiler's branch
    # develop-0.14.0-pil2-fflonk, until that branch is merged and setup/pil2-stark/package.json pins
    # it.
    #
    # The ptau is a test one, written here (pilfflonk/bench/inputs.rs: its τ is public, good for a
    # test and nothing else), with the fewest powers setup-snark accepts for this key: 2^19 rows,
    # 13·2^19 + 12 powers (it refuses fewer, and says how many it needs). 436 MB, where the Hermez
    # ptau of 2^24 is 19 GB.
    name: Test pilfflonk wrap (fibonacci-square)
    runs-on: ubuntu-latest
    env:
      PIL2_COMPILER_COMMIT: f4fbf33a9d8aae1381b9e57056b09c293522df2c
      CARGO_FEATURES: proofman-starks-lib-c/cpu-only
      WRAP: target/pilfflonk-wrap
      WRAP_PTAU_POWERS: 6815756
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out pil2-compiler (BN128)
        uses: actions/checkout@v4
        with:
          repository: 0xPolygonHermez/pil2-compiler
          ref: ${{ env.PIL2_COMPILER_COMMIT }}
          path: pil2-compiler-bn128

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - name: Install Node dependencies (pil2-compiler, snarkjs)
        run: npm install
        working-directory: setup/pil2-stark

      - name: Install Node dependencies (pil2-compiler BN128)
        run: npm ci
        working-directory: pil2-compiler-bn128

      - name: Install Node dependencies (pilfflonk JS verifier)
        run: npm install
        working-directory: pilfflonk/js

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sudo apt install -y build-essential libbenchmark-dev libomp-dev libgmp-dev nlohmann-json3-dev nasm libsodium-dev cmake
          sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev

      # circom is the committed setup/circom/circom (2.2.3), which compiles the final circuit's
      # custom templates. PIL2C_EXEC names the pil2com every compile-pil and setup runs
      # (resolve_pil2com_exec), Goldilocks ones included: the BN128 compiles of the wrap's AIR and of
      # the Fibonacci fixture need it.
      - name: Set up circom and the BN128 compiler
        run: |
          echo "$GITHUB_WORKSPACE/setup/circom" >> "$GITHUB_PATH"
          echo "PIL2C_EXEC=$GITHUB_WORKSPACE/pil2-compiler-bn128/src/pil.js" >> "$GITHUB_ENV"

      - name: Cargo build (release)
        run: |
          cargo build --release -p pil2-stark-setup -p proofman-cli -p fibonacci-square --features "$CARGO_FEATURES"
          cargo build --release -p proofman-cli --example pilfflonk_bench_inputs --features "$CARGO_FEATURES"

      - name: Setup Fibonacci Square
        run: |
          mkdir -p "$WRAP/build"
          target/release/proofman-setup compile-pil --pil ./examples/fibonacci-square/pil/build.pil -I ./pil2-components/lib/std/pil -o "$WRAP/build.pilout" -u "$WRAP/build/fixed" --fixed-to-file
          target/release/proofman-setup setup -a "$WRAP/build.pilout" -b "$WRAP/build" -r -u "$WRAP/build/fixed" --hash Poseidon2

      - name: Generate the vadcop_final proof of Fibonacci Square
        run: |
          target/release/proofman-cli gen-custom-commits-fixed --witness-lib target/release/libfibonacci_square.so --proving-key "$WRAP/build/provingKey/" --custom-commits rom="$WRAP/build/rom.bin"
          target/release/proofman-cli prove --witness-lib target/release/libfibonacci_square.so --proving-key "$WRAP/build/provingKey/" --public-inputs examples/fibonacci-square/src/inputs.json --output-dir "$WRAP/proofs" --custom-commits rom="$WRAP/build/rom.bin" -a
          target/release/proofman-cli verify-stark --proof "$WRAP/proofs/vadcop_final_proof.bin" --verkey "$WRAP/build/provingKey/build/vadcop_final/vadcop_final.verkey.bin"

      # About 3.5 CPU-hours (3 min 23 s on 64 threads): kept in the cache while its generator and
      # its size do not change.
      - name: Cache the test ptau
        id: wrap-ptau
        uses: actions/cache@v4
        with:
          path: ${{ env.WRAP }}/wrap.ptau
          key: pilfflonk-wrap-ptau-${{ env.WRAP_PTAU_POWERS }}-${{ hashFiles('setup/pilfflonk/src/test_ptau.rs', 'pilfflonk/bench/inputs.rs') }}

      - name: Write the test ptau
        if: steps.wrap-ptau.outputs.cache-hit != 'true'
        run: target/release/examples/pilfflonk_bench_inputs ptau "$WRAP_PTAU_POWERS" "$WRAP/wrap.ptau"

      - name: Setup SNARK with pilfflonk
        run: |
          target/release/proofman-setup setup-snark -b "$WRAP/build" --final-snark pilfflonk --powers-of-tau "$WRAP/wrap.ptau" --publics-info examples/fibonacci-square/src/publics_info.json

      # Another key's vkey, for verify-snark to refuse the wrap's proof with: the Fibonacci fixture's.
      - name: Setup pilfflonk of the Fibonacci fixture
        run: |
          mkdir -p "$WRAP/other"
          target/release/proofman-setup compile-pil --pil pilfflonk/tests/fixtures/fibonacci/fibonacci.pil -I pil2-components/lib/std/pil --field bn128 -o "$WRAP/other/fibonacci.pilout"
          target/release/proofman-setup setup-pilfflonk -a "$WRAP/other/fibonacci.pilout" -b "$WRAP/other" --powers-of-tau "$WRAP/wrap.ptau"
          echo "PROVE_SNARK_OTHER_VKEY=$(ls "$GITHUB_WORKSPACE/$WRAP"/other/provingKey/*/pilfflonk/pilfflonk.vkey.json)" >> "$GITHUB_ENV"

      - name: Prove and verify the wrap with pilfflonk
        env:
          PROVE_SNARK_PROVING_KEY: ${{ github.workspace }}/${{ env.WRAP }}/build/provingKeySnark
          PROVE_SNARK_PROOF: ${{ github.workspace }}/${{ env.WRAP }}/proofs/vadcop_final_proof.bin
        run: |
          cargo test --release -p proofman-cli --features "$CARGO_FEATURES" --test snark_pilfflonk -- --ignored --test-threads 1

  test-recursive:
    name: Test Recursive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"
      - name: Install npm
        run: npm install -g npm
      - name: Check npm version
        run: npm --version

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install z3-solver
        run: |
          python -m pip install z3-solver

      - name: Check out circom
        uses: actions/checkout@v4
        with:
          repository: iden3/circom
          path: circom-repo


      - name: Build and install Circom
        working-directory: circom-repo
        run: |
          cargo build --release --workspace
          cargo install --path circom

      - name: Install npm packages
        run: npm install
        working-directory: setup/pil2-stark

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sudo apt install -y build-essential libbenchmark-dev libomp-dev libgmp-dev nlohmann-json3-dev nasm libsodium-dev cmake
          sudo apt-get install -y openmpi-bin openmpi-common libopenmpi-dev

      # ---------------------------------------------------------------------
      # Poseidon2. The hash family is selected at runtime from the setup, so it
      # is passed explicitly via --hash (no feature flag, no compile-time
      # default). Both setup types (compressor + aggregation) reuse the same
      # workspace build; only the setup-recursive-test step differs.
      # ---------------------------------------------------------------------
      - name: Setup Recursive Poseidon2 (Compressor)
        run: |
          cargo run --bin proofman-setup -- setup-recursive-test -b ./examples/test-recursive/build -c ./examples/test-recursive/test.circom -n test -t compressor --hash Poseidon2

      - name: Cargo build Poseidon2
        run: RUST_BACKTRACE=1 cargo build -v --workspace

      - name: Verify constraints Recursive Poseidon2 (Compressor)
        run: |
          cargo run --bin proofman-cli verify-constraints --witness-lib ./target/debug/libtest_recursive.so --proving-key examples/test-recursive/build/provingKey

      - name: Generate proof Recursive Poseidon2 (Compressor)
        run: |
          cargo run --bin proofman-cli prove --witness-lib ./target/debug/libtest_recursive.so --proving-key examples/test-recursive/build/provingKey/ --output-dir examples/test-recursive/build/proofs -y

      - name: Clean proof dir Poseidon2 (Compressor)
        run: rm -rf examples/test-recursive/build/proofs

      - name: Setup Recursive Poseidon2 (Aggregation)
        run: |
          cargo run --bin proofman-setup -- setup-recursive-test -b ./examples/test-recursive/build -c ./examples/test-recursive/test.circom -n test -t aggregation --hash Poseidon2

      - name: Verify constraints Recursive Poseidon2 (Aggregation)
        run: |
          cargo run --bin proofman-cli verify-constraints --witness-lib ./target/debug/libtest_recursive.so --proving-key examples/test-recursive/build/provingKey

      - name: Generate proof Recursive Poseidon2 (Aggregation)
        run: |
          cargo run --bin proofman-cli prove --witness-lib ./target/debug/libtest_recursive.so --proving-key examples/test-recursive/build/provingKey/ --output-dir examples/test-recursive/build/proofs -y

      - name: Clean proof dir Poseidon2 (Aggregation)
        run: rm -rf examples/test-recursive/build/proofs

      # ---------------------------------------------------------------------
      # Poseidon1 (Hades). The hash family is selected at runtime from the
      # setup, so only the setup needs --hash Poseidon1; the already-built
      # binaries are reused (no rebuild, no feature flag).
      # ---------------------------------------------------------------------
      - name: Setup Recursive Poseidon1 (Compressor)
        run: |
          cargo run --bin proofman-setup -- setup-recursive-test -b ./examples/test-recursive/build -c ./examples/test-recursive/test.circom -n test -t compressor --hash Poseidon1

      - name: Verify constraints Recursive Poseidon1 (Compressor)
        run: |
          cargo run --bin proofman-cli verify-constraints --witness-lib ./target/debug/libtest_recursive.so --proving-key examples/test-recursive/build/provingKey

      - name: Generate proof Recursive Poseidon1 (Compressor)
        run: |
          cargo run --bin proofman-cli prove --witness-lib ./target/debug/libtest_recursive.so --proving-key examples/test-recursive/build/provingKey/ --output-dir examples/test-recursive/build/proofs -y

      - name: Clean proof dir Poseidon1 (Compressor)
        run: rm -rf examples/test-recursive/build/proofs

      - name: Setup Recursive Poseidon1 (Aggregation)
        run: |
          cargo run --bin proofman-setup -- setup-recursive-test -b ./examples/test-recursive/build -c ./examples/test-recursive/test.circom -n test -t aggregation --hash Poseidon1

      - name: Verify constraints Recursive Poseidon1 (Aggregation)
        run: |
          cargo run --bin proofman-cli verify-constraints --witness-lib ./target/debug/libtest_recursive.so --proving-key examples/test-recursive/build/provingKey

      - name: Generate proof Recursive Poseidon1 (Aggregation)
        run: |
          cargo run --bin proofman-cli prove --witness-lib ./target/debug/libtest_recursive.so --proving-key examples/test-recursive/build/provingKey/ --output-dir examples/test-recursive/build/proofs -y

      - name: Clean proof dir Poseidon1 (Aggregation)
        run: rm -rf examples/test-recursive/build/proofs
