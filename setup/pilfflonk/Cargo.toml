[package]
name = "pilfflonk-setup"
description = "Setup for the pilfflonk backend (PIL2 over BN128 with fflonk): validation, grouping, bytecode and keys"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[features]
# `pilfflonk_setup::test_ptau`: a powers-of-tau file with τ = 1 (pilfflonk/docs/README.md#tests).
# For tests only: nothing but tests turns it on, this crate's through the dev-dependency on itself
# below.
test-ptau = []

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
num-bigint = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The Solidity verifier's template (`solidity`), as `pil2-stark-recurser` renders its own.
tera = "1"
tracing = { workspace = true }
pil2-pilout = { workspace = true }
pil-info = { workspace = true }
proofman-pilfflonk = { workspace = true }
proofman-starks-lib-c = { workspace = true }

[dev-dependencies]
# Turns the test ptau on for the tests of this crate.
pilfflonk-setup = { path = ".", features = ["test-ptau"] }
# The Rust oracle, which the fixtures of the C++ interpreter's tests and of the JS verifier's
# (tests/js_fixtures.rs) are computed with.
proofman-pilfflonk = { workspace = true, features = ["oracle"] }
