[package]
name = "pil2-stark-recurser"
description = "STARK recursion setup tooling for the pil2-stark prover"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[lib]
path = "lib.rs"

[dependencies]
proofman-fields = { workspace = true, features = ["verify"] }
proofman-common = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
tracing = { workspace = true }
num-bigint = { workspace = true }
tera = "1"

[dev-dependencies]
rand = { workspace = true }
serde_json = { workspace = true }
# The BN128 wrap's tests (tests/poseidon_bn128_wrap.rs) set up, check and prove its AIR with
# pilfflonk, on a test ptau.
pilfflonk-setup = { workspace = true, features = ["test-ptau"] }
proofman-pilfflonk = { workspace = true }
