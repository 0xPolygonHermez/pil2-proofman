[package]
name = "pil2-fflonk"
description = "PIL2-FFLONK: a SHPLONK/KZG prover over BN254 for PIL2 AIRs"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

# The C++ prover lives under cpp/ and is built by its own Makefile. Disable
# automatic target discovery so Cargo does not scan that tree -- except for
# tests/, which carries the wrapper that runs the C++ suite.
autobins = false
autoexamples = false
autotests = true
autobenches = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
sha3 = "0.10"

# The field, curve and transcript arithmetic lives in the C++ this wraps --
# rapidsnark's, the same code the fflonk prover is built on. Reimplementing any
# of it in Rust would be a second definition to keep in step, so the C++
# toolchain is a build requirement rather than a test-only one.
proofman-fflonk-lib-c = { workspace = true }

[dev-dependencies]
