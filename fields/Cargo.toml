[package]
name = "proofman-fields"
description = "Goldilocks field arithmetic, extensions, Poseidon hashes, Merkle trees, and FRI primitives for PIL2 proofman"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[dependencies]
paste = "1.0.15"
cfg-if = "1.0"
serde = { version = "1.0.130", default-features = false, features = ["derive"] }
num-bigint = { version = "0.4", default-features = false }
blake3 = { workspace = true, default-features = false }

[features]
# Gates nothing. Kept only because setup/pil2-stark and setup/stark-recurser enable it:
# ZisK keys its setup cache on proofman's setup/ tree, so editing those manifests would
# force every consumer to rebuild its setup. Drop it with the next setup change.
verify = []

[dev-dependencies]
rand = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_vendor, values("zisk"))',
] }
