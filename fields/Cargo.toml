[package]
name = "proofman-fields"
description = "Goldilocks field arithmetic, extensions, Poseidon hashes, Merkle trees, and FRI primitives for PIL2 proofman"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[dependencies]
paste = "1.0.15"
cfg-if = "1.0"
serde = { version = "1.0.130", default-features = false, features = ["derive"] }
num-bigint = { version = "0.4", default-features = false }
blake3 = { workspace = true, default-features = false }

# Native STARKS C library — host-only (x86_64). Optional, so that a consumer which only verifies
# does not build it: every call into it is already compiled out under `verify`.
[target.'cfg(target_arch = "x86_64")'.dependencies]
proofman-starks-lib-c = { workspace = true, optional = true }

[features]
default = ["dep:proofman-starks-lib-c"]
verify = []

[dev-dependencies]
rand = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_vendor, values("zisk"))',
] }
