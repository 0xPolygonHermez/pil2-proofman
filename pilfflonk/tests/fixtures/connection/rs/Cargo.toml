[package]
name = "pilfflonk-connection"
description = "The pilfflonk witness library of the Connection fixture, over BN128's Fr: a test of the witness-library API"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
proofman-pilfflonk = { workspace = true }
# The rows `pil_helpers` generates: `GenericTrace` and `trace_row!`; and the logger. The program has
# no publics, and so no `serde` structs.
proofman-common = { workspace = true }
proofman-macros = { workspace = true }
proofman-fields = { workspace = true }

[dev-dependencies]
# Regenerates `src/pil_helpers` to check it is what pil-helpers writes.
proofman-cli = { workspace = true }
# Sets up the fixture's keys, with the ptau of `τ = 1` (pilfflonk/docs/README.md#tests).
pilfflonk-setup = { workspace = true, features = ["test-ptau"] }
