syntax = "proto3";
package pilout;

// pilout version 2, the one generated by default. Version 1 (legacy) is on
// pilout_1.proto and could be generated with -O pilout-version=1.

message PilOut {
    optional string name = 1;
    bytes baseField = 2;                        // base field characteristic
    repeated AirGroup airGroups = 3;
    repeated uint32 numChallenges = 4;          // number of challenges per stage
    repeated uint32 numProofValues = 5;
    uint32 numPublicValues = 6;
    repeated PublicTable publicTables = 7;
    repeated GlobalExpression expressions = 8;
    repeated GlobalConstraint constraints = 9;  // Constraints that apply only to signals
    repeated Hint hints = 10;
    repeated Symbol symbols = 11;
}

message AirGroup {
    optional string name = 1;
    repeated AirGroupValue airGroupValues = 2;
    repeated Air airs = 3;
}

message AirGroupValue {
    AggregationType aggType = 1;
    uint32 stage = 2;
}

enum AggregationType {
    SUM = 0;
    PROD = 1;
}

message PublicTable {
    uint32 numCols = 1;
    uint32 maxRows = 2;
    AggregationType aggType = 3;
    GlobalOperand.Expression rowExpressionIdx = 4;
}

message GlobalConstraint {
    GlobalOperand.Expression expressionIdx = 1;
    optional string debugLine = 2;
}

message GlobalExpression {
    message Add {
        GlobalOperand lhs = 1;
        GlobalOperand rhs = 2;
    }

    message Sub {
        GlobalOperand lhs = 1;
        GlobalOperand rhs = 2;
    }

    message Mul {
        GlobalOperand lhs = 1;
        GlobalOperand rhs = 2;
    }

    message Neg {
        GlobalOperand value = 1;
    }

    oneof operation {
        Add add = 1;
        Sub sub = 2;
        Mul mul = 3;
        Neg neg = 4;
    }
}

message GlobalOperand {
    message Constant {
        bytes value = 1;    // basefield element, variable length
    }

    message Challenge {
        uint32 stage = 1;
        uint32 idx = 2;         // index relative to the stage
    }

    message ProofValue {
        uint32 stage = 1;
        uint32 idx = 2;
    }

    message AirGroupValue {
        uint32 airGroupId = 1;
        uint32 idx = 2;
    }

    message PublicValue {
        uint32 idx = 1;
    }

    message PublicTableAggregatedValue {
        uint32 idx = 1;
    }

    message PublicTableColumn {
        uint32 idx = 1;         // public table index
        uint32 colIdx = 2;      // column index within the table
    }

    message Expression {
        uint32 idx = 1;
    }

    oneof operand {
        Constant constant = 1;
        Challenge challenge = 2;
        ProofValue proofValue = 3;
        AirGroupValue airGroupValue = 4;
        PublicValue publicValue = 5;
        PublicTableAggregatedValue publicTableAggregatedValue = 6;
        PublicTableColumn publicTableColumn = 7;
        Expression expression = 8;
    }
}

message Air {
    optional string name = 1;
    optional uint32 numRows = 2;            // log2(n), where n is the number of rows
    repeated PeriodicCol periodicCols = 3;
    repeated FixedCol fixedCols = 4;
    repeated uint32 stageWidths = 5;        // stage widths excluding stage 0 (fixed columns)
    repeated Expression expressions = 6;
    repeated Constraint constraints = 7;
    repeated AirValue airValues = 8;        // stage airvalues
    bool aggregable = 9;
    repeated CustomCommit customCommits = 10;
    repeated Domain domains = 11;           // row selectors referenced by constraints
}

message Domain {                  // its name is on the symbols
    uint32 cycleBits = 1;        // log2(cycle), the cycle is always a power of 2
    repeated uint32 offsets = 2; // rows of the cycle where the domain holds
}

message CustomCommit {
    optional string name = 1;
    repeated GlobalOperand.PublicValue publicValues = 2;
    repeated uint32 stageWidths = 3;    // stage widths including stage 0 !!
}

message AirValue {
    uint32 stage = 1;
}

message PeriodicCol {
    repeated bytes values = 1;   // BaseFieldElement, only the cycle
}

message FixedCol {
    repeated bytes values = 1; // BaseFieldElement
}

message Constraint {
    message AllRows {
        Operand.Expression expressionIdx = 1;
        optional string debugLine = 2;
    }

    // holds on the rows selected by Air.domains[domainIdx]
    message DomainRows {
        uint32 domainIdx = 1;
        Operand.Expression expressionIdx = 2;
        optional string debugLine = 3;
    }

    // holds on the rows NOT selected by Air.domains[domainIdx]
    message ComplementDomainRows {
        uint32 domainIdx = 1;
        Operand.Expression expressionIdx = 2;
        optional string debugLine = 3;
    }

    oneof constraint {
        DomainRows domainRows = 1;
        ComplementDomainRows complementDomainRows = 2;
        AllRows allRows = 3;
    }
}

message Operand {
    message Constant {
        bytes value = 1; // BaseFieldElement
    }

    message Challenge {
        uint32 stage = 1;
        uint32 idx = 2;     // index relative to the stage
    }

    message ProofValue {
        uint32 stage = 1;
        uint32 idx = 2;
    }

    message AirGroupValue {
        uint32 idx = 1;
    }

    message AirValue {
        uint32 idx = 1;
    }

    message PublicValue {
        uint32 idx = 1;
    }

    message PeriodicCol {
        uint32 idx = 1;
        sint32 rowOffset = 2;
    }

    message FixedCol {
        uint32 idx = 1;
        sint32 rowOffset = 2;
    }

    message WitnessCol {
        uint32 stage = 1;
        uint32 colIdx = 2;      // index relative to the stage
        sint32 rowOffset = 3;
    }

    message CustomCol {
        uint32 commitId = 1;
        uint32 stage = 2;
        uint32 colIdx = 3;      // absolute idx relative to the stage
        sint32 rowOffset = 4;
    }

    message Expression {
        uint32 idx = 1;
    }

    oneof operand {
        Constant constant = 1;
        Challenge challenge = 2;
        ProofValue proofValue = 3;
        AirGroupValue airGroupValue = 4;
        PublicValue publicValue = 5;
        PeriodicCol periodicCol = 6;
        FixedCol fixedCol = 7;
        WitnessCol witnessCol = 8;
        Expression expression = 9;
        AirValue airValue = 10;
        CustomCol customCol = 11;
    }
}

message Expression {
    message Add {
        Operand lhs = 1;
        Operand rhs = 2;
    }

    message Sub {
        Operand lhs = 1;
        Operand rhs = 2;
    }

    message Mul {
        Operand lhs = 1;
        Operand rhs = 2;
    }

    message Neg {
        Operand value = 1;
    }

    oneof operation {
        Add add = 1;
        Sub sub = 2;
        Mul mul = 3;
        Neg neg = 4;
    }
}

// ================ Symbols ================

enum SymbolType {
    IM_COL = 0;
    FIXED_COL = 1;
    PERIODIC_COL = 2;
    WITNESS_COL = 3;
    PROOF_VALUE = 4;
    AIR_GROUP_VALUE = 5;
    PUBLIC_VALUE = 6;
    PUBLIC_TABLE = 7;
    CHALLENGE = 8;
    AIR_VALUE = 9;
    CUSTOM_COL = 10;
    DOMAIN = 11;
}

message Symbol {
    string name = 1;
    optional uint32 airGroupId = 2;
    optional uint32 airId = 3;
    SymbolType type = 4;
    uint32 id = 5;
    optional uint32 stage = 6;
    uint32 dim = 7;
    repeated uint32 lengths = 8;
    optional uint32 commitId = 9;
    optional string debugLine = 10;
}

// ================ Hints ================

message HintField {
    optional string name = 1;
    oneof value {
        string stringValue = 2;
        Operand operand = 3;
        HintFieldArray hintFieldArray = 4;
    }
}

message HintFieldArray {
    repeated HintField hintFields = 1;
}

message Hint {
    string name = 1;
    repeated HintField hintFields = 2;
    optional uint32 airGroupId = 3;
    optional uint32 airId = 4;
}
