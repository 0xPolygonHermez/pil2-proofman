[package]
name = "proofman-cli"
description = "Command-line toolchain for the PIL2 proofman framework"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }
publish = false

readme = "README.md"

[dependencies]
pil2-pilout = { workspace = true }
proofman-util = { workspace = true }
proofman = { workspace = true }
proofman-common = { workspace = true }
proofman-starks-lib-c = { workspace = true }
proofman-verifier = { workspace = true }
proofman-soundness = { workspace = true }
proofman-witness = { workspace = true }
proofman-fields = { workspace = true }
proofman-exps-codegen = { workspace = true }
proofman-pilfflonk = { workspace = true }

tracing.workspace = true
libloading.workspace = true
blake3.workspace = true
colored.workspace = true
serde.workspace = true

clap = { version = "4.5.38", features = ["derive", "env"] }
tinytemplate = "1.1"
convert_case = "0.8"
regex = "1.12.2"
toml = "0.9.8"

[dev-dependencies]
# The keys and the test ptaus (pilfflonk/docs/README.md#tests) of the `pilfflonk verify` and
# `pilfflonk prove` tests.
pilfflonk-setup = { workspace = true, features = ["test-ptau"] }
# The Rust oracle, which the `pilfflonk prove` test checks the prover against.
proofman-pilfflonk = { workspace = true, features = ["oracle"] }
serde_json = { workspace = true }
# The tests' pilouts and values: a `baseField` and the values of `Fr` are big integers.
num-bigint = { workspace = true }
# Encodes the synthetic pilouts of the domains tests, built in code.
prost = { workspace = true }
# The seeded mutations of the differential fuzzer of the Solidity verifier
# (pilfflonk/docs/verifier.md#differential-fuzzer).
rand = { workspace = true }
# The pilfflonk witness libraries of the fixtures (pilfflonk/docs/README.md#fixtures), which
# `pilfflonk prove` and `pilfflonk check` load with `--witness-lib`, and a STARK one, which they
# refuse: Cargo builds them beside the tests.
pilfflonk-fibonacci = { path = "../pilfflonk/tests/fixtures/fibonacci/rs" }
pilfflonk-connection = { path = "../pilfflonk/tests/fixtures/connection/rs" }
pilfflonk-all = { path = "../pilfflonk/tests/fixtures/all/rs" }
fibonacci-square = { path = "../examples/fibonacci-square" }

# The inputs of the pilfflonk benchmark (pilfflonk/bench/bench.sh,
# pilfflonk/docs/performance.md#reproducing): a test ptau and the witnesses of its programs, from
# the fixtures' generators, as the tests take them.
[[example]]
name = "pilfflonk_bench_inputs"
path = "../pilfflonk/bench/inputs.rs"

[features]
default = ["mpi"]
mpi = ["proofman/mpi", "proofman-common/mpi"]
