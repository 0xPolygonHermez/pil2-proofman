[package]
name = "proofman"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[dependencies]
# sched_getcpu, for the core-placement fields in the contributions profile.
libc = "0.2"
proofman-common = { path = "../common" }
proofman-macros = { path = "../macros" }
proofman-hints = { path = "../hints" }
proofman-util = { path = "../util" }
proofman-starks-lib-c = { path = "../provers/starks-lib-c" }
proofman-verifier = { path = "../verifier", features = ["parallel"] }
curves = { path = "../curves" }
witness = { path = "../witness" }
pil-std-lib = { workspace = true }

tracing.workspace = true
fields.workspace = true
libloading.workspace = true
colored.workspace = true
serde_json.workspace = true
serde.workspace = true
rayon.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
bincode.workspace = true
blake3.workspace = true
crossbeam-channel.workspace = true
borsh.workspace = true
tokio.workspace = true
tokio-util.workspace = true
csv.workspace = true
chrono = "0.4.42"
mpi = { workspace = true, optional = true }

[features]
default = ["mpi"]
mpi = ["dep:mpi", "proofman-common/mpi"]
diagnostic = ["proofman-macros/diagnostic", "proofman-common/diagnostic"]
