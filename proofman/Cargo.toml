[package]
name = "proofman"
description = "PIL2 proof manager: orchestrates witness generation, STARK proving, recursion, and SNARK wrapping"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[dependencies]
proofman-common = { workspace = true }
proofman-macros = { workspace = true }
proofman-hints = { workspace = true }
proofman-util = { workspace = true }
proofman-starks-lib-c = { workspace = true }
proofman-verifier = { workspace = true, features = ["parallel"] }
pil2-std-lib = { workspace = true }

tracing.workspace = true
proofman-curves.workspace = true
proofman-witness.workspace = true
proofman-fields.workspace = true
libloading.workspace = true
colored.workspace = true
serde_json.workspace = true
serde.workspace = true
rayon.workspace = true
num-traits.workspace = true
bincode.workspace = true
blake3.workspace = true
crossbeam-channel.workspace = true
borsh.workspace = true
tokio-util.workspace = true
csv.workspace = true
chrono = "0.4.42"
mpi = { workspace = true, optional = true }

[features]
default = ["mpi"]
mpi = ["dep:mpi", "proofman-common/mpi"]
diagnostic = ["proofman-macros/diagnostic", "proofman-common/diagnostic"]