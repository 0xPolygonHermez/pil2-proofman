[package]
name = "proofman-verifier"
description = "STARK proof verifier with Poseidon transcripts for the PIL2 proofman framework"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

[dependencies]
proofman-fields.workspace = true
serde = { version = "1.0.130", default-features = false, features = ["alloc", "derive"] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
bincode = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
default = ["std"]
std = ["dep:tracing", "dep:bincode", "serde/std"]
# A no-op since rayon was dropped (its ~0.2 ms pool hand-off outweighed the query loop); kept so
# dependants that enable it still build.
parallel = ["std"]
