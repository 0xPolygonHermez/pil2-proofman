[package]
name = "proofman-starks-src"
description = "Vendored pil2-stark prover sources (C/C++/CUDA), compiled by proofman-starks-lib-c"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
categories = { workspace = true }

# This directory's `src/` is the pil2-stark C++/CUDA prover, not Rust. The only
# Rust in this crate is a one-function shim at the root, so disable automatic
# target discovery to keep Cargo from scanning the C++ tree.
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "proofman_starks_src"
path = "starks_src.rs"
